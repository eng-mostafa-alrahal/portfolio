name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "18"
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build production bundle
        run: npx ng build --configuration production --base-href /portfolio/

      - name: Add SPA fallback and disable Jekyll
        run: |
          cp dist/mostafa-alrahal-portfolio/index.html dist/mostafa-alrahal-portfolio/404.html
          touch dist/mostafa-alrahal-portfolio/.nojekyll
          test -f dist/mostafa-alrahal-portfolio/llms.txt
          test -f dist/mostafa-alrahal-portfolio/profile.json
          test -f dist/mostafa-alrahal-portfolio/profile.html
          test -f dist/mostafa-alrahal-portfolio/robots.txt
          test -f dist/mostafa-alrahal-portfolio/sitemap.xml
          test -f dist/mostafa-alrahal-portfolio/.well-known/llms.txt

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/mostafa-alrahal-portfolio

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
