<section class="section more-proyects" id="more-proyects">
    <div class="container">
        <div class="section-box">
            <div data-aos="fade-up" data-aos-duration="1000">
                <h3 class="section-title">
                    <span class='n-section-title'>04.</span> {{"OtherProjects.Title" | translate}}
                </h3>
                <p class="section-subtitle">{{ "OtherProjects.Subtitle" | translate }}</p>
            </div>
            <div class="mt-4">
                <div class="row p-0">
                    <div *ngFor='let project of "OtherProjects.Projects" | translate; let i = index'
                      (click)="redirect(project['demoLink'] || project['ghLink'], $event)"
                      class="col-12 col-md-6 col-lg-6 proyect-col" data-aos="fade-up" data-aos-duration="1000">
                        <div class="more-proyect-box">
                            <div class="w-100">
                                <div class="card-top-bar">
                                    <div class="folder-and-badge">
                                        <img src='assets/images/folder.svg' width="34" alt="Repository">
                                        <span class="project-badge" *ngIf="project.Badge">{{ project.Badge }}</span>
                                    </div>
                                    <div class="card-links">
                                        <a *ngIf="project['ghLink']" (click)='onLinkClick($event, "click_project_github")' [href]="project['ghLink']" target="_blank" rel="noopener noreferrer" title="View GitHub Repository">
                                            <i id="ghLink" class="fab fa-github"></i>
                                        </a>
                                        <a *ngIf="project['demoLink']" (click)='onLinkClick($event, "click_project_external_link")' [href]="project['demoLink']" target="_blank" rel="noopener noreferrer" title="External Link">
                                            <i id="demoLink" class="fas fa-external-link-alt"></i>
                                        </a>
                                    </div>
                                </div>
                                <h5 class="other-proyect-title mt-3">{{project.Title}}</h5>
                                <p class="other-proyect-description">
                                    {{project.Description}}
                                </p>
                            </div>
                            <div class="w-100 mt-3">
                                <div class="more-proyects-skills">
                                    <span *ngFor='let technology of project.Technologies' class="tech-badge">
                                      {{technology}}
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
