<section class="section proyects" id='proyects'>
    <div class="container">
        <div class="section-box">
            <div data-aos="fade-up" data-aos-duration="1000">
                <h3 class="section-title">
                    <span class='n-section-title'>03.</span> {{"FeatureProjects.Title" | translate}}
                </h3>
                <p class="section-subtitle">{{ "FeatureProjects.Subtitle" | translate }}</p>
            </div>

            <div *ngFor='let project of "FeatureProjects.Projects" | translate; let i = index' class="case-study-card" [class.reverse-layout]='i%2!=0' data-aos="fade-up" data-aos-duration="1000">
                <div #caseMedia class="case-study-media">
                    <owl-carousel-o class='owl-carousel-o' [options]="customOptions">
                        <ng-container *ngFor="let img of project.imgs; let imgIndex = index">
                            <ng-template carouselSlide [id]="project.Title + '-' + i + '-' + imgIndex">
                                <div #imgContainer class='img-container'>
                                    <img class='img-feature-proyect rounded' [src]="img" [alt]="project.Title">
                                </div>
                            </ng-template>
                        </ng-container>
                    </owl-carousel-o>
                </div>

                <div class="case-study-info">
                    <span class="feature-proyect-badge">{{ project.Label || ("FeatureProjects.Label" | translate) }}</span>
                    <h4 class="proyect-name">{{project.Title}}</h4>

                    <div class="proyect-description-box">
                        <p class="mb-2" [innerHTML]="project.Description"></p>
                        <ul class="case-study-highlights" *ngIf="project.Highlights && project.Highlights.length">
                            <li *ngFor="let point of project.Highlights">{{ point }}</li>
                        </ul>
                    </div>

                    <div class="proyect-skills">
                        <span *ngFor='let technology of project.Technologies' class="tech-badge">
                            {{technology}}
                        </span>
                    </div>

                    <div class="proyect-links">
                        <a *ngIf="project['ghLink']" class="project-action-link" [href]="project['ghLink']" target="_blank" rel="noopener noreferrer">
                            <i class="fab fa-github"></i> Source Code
                        </a>
                        <a *ngIf="project['demoLink']" class="project-action-link" [href]="project['demoLink']" target="_blank" rel="noopener noreferrer">
                            <i class="fas fa-external-link-alt"></i> Live App
                        </a>
                        <a *ngIf="project['pressLink']" class="project-action-link" [href]="project['pressLink']" target="_blank" rel="noopener noreferrer">
                            <i class="far fa-newspaper"></i> Official Release
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
