<footer>
    <div [@animateFooter]>
        <ul class="footer-left-bar d-none d-md-block">
            <li>
                <a (click)='analyticsService.sendAnalyticEvent("click_github", "footer", "github")' href="https://github.com/eng-mostafa-alrahal" target='_blank' rel="noopener noreferrer" title="GitHub">
                    <i class="fab fa-github"></i>
                </a>
            </li>
            <li>
                <a (click)='analyticsService.sendAnalyticEvent("click_linkedin", "footer", "linkedin")' href="https://www.linkedin.com/in/mostafa-alrahal-368972229/" target='_blank' rel="noopener noreferrer" title="LinkedIn">
                    <i class="fab fa-linkedin-in"></i>
                </a>
            </li>
            <li>
                <a (click)='analyticsService.sendAnalyticEvent("click_send_mail", "footer", "email")' href="mailto:{{ 'Contact.Email' | translate }}" target='_blank' title="Email">
                    <i class="fas fa-envelope"></i>
                </a>
            </li>
        </ul>
        <div class="footer-right-bar d-none d-md-block">
            <a (click)='analyticsService.sendAnalyticEvent("click_send_mail", "footer", "email")' href="mailto:{{ 'Contact.Email' | translate }}" target='_blank'>{{ 'Contact.Email' | translate }}</a>
        </div>
        <ul class="footer-mobile-bar d-flex d-md-none">
            <li>
                <a href="https://github.com/eng-mostafa-alrahal" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
                    <i class="fab fa-github"></i>
                </a>
            </li>
            <li>
                <a href="https://www.linkedin.com/in/mostafa-alrahal-368972229/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
                    <i class="fab fa-linkedin-in"></i>
                </a>
            </li>
            <li>
                <a href="mailto:{{ 'Contact.Email' | translate }}" target="_blank" aria-label="Email">
                    <i class="fas fa-envelope"></i>
                </a>
            </li>
        </ul>
    </div>
</footer>
